<script id="importance-color-test-script">
(() => {
  const STAR_RE = /★\s*([1-5])/g;

  function colorStars(root) {
    // A queued mutation may refer to text removed during a view transition.
    if (!root) return;
    const walker = document.createTreeWalker(
      root,
      NodeFilter.SHOW_TEXT,
      {
        acceptNode(node) {
          if (!node.nodeValue || !STAR_RE.test(node.nodeValue)) {
            STAR_RE.lastIndex = 0;
            return NodeFilter.FILTER_REJECT;
          }
          STAR_RE.lastIndex = 0;
          if (node.parentElement?.closest('.importance-color-1,.importance-color-2,.importance-color-3,.importance-color-4,.importance-color-5')) {
            return NodeFilter.FILTER_REJECT;
          }
          return NodeFilter.FILTER_ACCEPT;
        }
      }
    );

    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);

    for (const node of nodes) {
      const text = node.nodeValue;
      const frag = document.createDocumentFragment();
      let last = 0;
      let match;

      STAR_RE.lastIndex = 0;
      while ((match = STAR_RE.exec(text)) !== null) {
        if (match.index > last) {
          frag.appendChild(document.createTextNode(text.slice(last, match.index)));
        }

        const span = document.createElement('span');
        span.className = `importance-color-${match[1]}`;
        span.textContent = match[0];
        frag.appendChild(span);

        last = STAR_RE.lastIndex;
      }

      if (last < text.length) {
        frag.appendChild(document.createTextNode(text.slice(last)));
      }

      node.replaceWith(frag);
    }
  }

  const run = () => colorStars(document.body);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', run, { once: true });
  } else {
    run();
  }

  const observer = new MutationObserver((mutations) => {
    for (const mutation of mutations) {
      for (const added of mutation.addedNodes) {
        if (added.nodeType === Node.TEXT_NODE) {
          colorStars(added.parentNode);
        } else if (added.nodeType === Node.ELEMENT_NODE) {
          colorStars(added);
        }
      }
    }
  });

  observer.observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
