<!doctype html><html lang="ko" spellcheck="false"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>세계는 동시에 · 모바일 VR 재구축</title><link rel="stylesheet" href="vr.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js"}}</script><body><canvas id="room"></canvas><div id="web"></div><section id="gate"><h1>세계는 동시에 · VR</h1><p>휴대폰을 돌려 공간에 고정된 책장을 둘러봅니다.</p><p>이번 개발본은 회전만 지원합니다. 실제 걷기 이동은 아직 지원하지 않습니다.</p><p>진단 기록은 이 기기의 브라우저에만 저장됩니다. 자동 전송하지 않습니다.</p><button id="exportPrevious">이전 실행 기록 받기</button><button id="allow">동작 및 방향 허용</button><p id="loading" role="status">준비 중…</p></section><header id="info" hidden>VR 개발본 · 회전 추적 · 실제 위치 추적 미지원</header><nav id="controls" hidden><button id="place">재배치</button><button id="back">책장으로</button><button id="exportCurrent">진단 기록</button><button id="ui">UI 숨김</button></nav><script>
