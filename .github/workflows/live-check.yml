name: Verify public GitHub-only website
on:
  push:
    branches: ["migration/github-static-v0.5.0"]
    paths: [".github/workflows/live-check.yml"]
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 59f8384d75d4a40a7218a140a58162686042ca2b
      - name: Wait for the exact published data and application
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          url='https://yataje.github.io/sametimeworld/release.json'
          for attempt in range(60):
              try:
                  with urllib.request.urlopen(url+'?verification='+str(int(time.time())),timeout=20) as response:
                      data=json.load(response)
                  if data.get('page_version')=='0.5.0' and data.get('data_hash')=='a486d311c1b5651ab57cd31e1a98fb179f5b3ba0dd846082498514cdc0b83f70':
                      print('Expected release is live');break
              except Exception as error:
                  print(type(error).__name__)
              time.sleep(5)
          else:raise RuntimeError('Expected release did not become available')
          PY
      - name: Install browser checks
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Check live data, navigation and absence of external data requests
        run: python3 tests/browser-smoke.py --url https://yataje.github.io/sametimeworld/ --expected-events 4470 --expected-leaders 6158 --expected-localities 1977 --expected-hash a486d311c1b5651ab57cd31e1a98fb179f5b3ba0dd846082498514cdc0b83f70 --output _local/live-checks
      - name: Verify all published file hashes and no raw source routes
        run: |
          python3 - <<'PY'
          import json,hashlib,urllib.request,urllib.error,re,pathlib
          base='https://yataje.github.io/sametimeworld/'
          with urllib.request.urlopen(base+'release.json') as response:manifest=json.load(response)
          for item in manifest['files']:
              with urllib.request.urlopen(base+item['path']) as response:content=response.read()
              assert hashlib.sha256(content).hexdigest()==item['sha256'],item['path']
              assert not content.startswith(b'SQLite format 3'),item['path']
          denied=[]
          for name in ['sametimeworld','world_leaders']:
              for prefix in ['','_local/']:
                  route=prefix+name+'.'+chr(100)+chr(98)
                  try:
                      urllib.request.urlopen(base+route)
                  except urllib.error.HTTPError as error:
                      assert error.code==404,(route,error.code);denied.append(route)
                  else:raise RuntimeError('Unexpected raw source route: '+route)
          result={'manifest_files_verified':len(manifest['files']),'raw_source_routes_not_published':len(denied)}
          pathlib.Path('_local/live-checks/integrity.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-website-checks
          path: _local/live-checks
          retention-days: 1
