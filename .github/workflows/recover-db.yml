name: Inspect published dataset without mutation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "recover-db"
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify published packet against integrated release
        run: |
          mkdir -p _local/public-inspection
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {readDescriptor,readPacket,unseal} from './scripts/seal.mjs';
          const root=process.cwd(),descriptor=readDescriptor(root);
          const data=unseal(readPacket(root,descriptor),descriptor);
          const expected=JSON.parse(fs.readFileSync('docs/deployment/integrated-release.json','utf8'));
          assert.equal(data.events.length,expected.events);
          assert.equal(data.leaders.length,expected.leaders);
          assert.equal(data.meta.content_hash,expected.data_hash);
          assert.equal(new Set(data.events.map(e=>e.id)).size,expected.events);
          const report={success:true,events:data.events.length,leaders:data.leaders.length,data_version:data.meta.events_db_version,data_hash:data.meta.content_hash,note:'Read-only public inspection. The relational master cannot be reconstructed from a reduced web export. Use the approved master export/publish pipeline for updates.'};
          fs.writeFileSync('_local/public-inspection/report.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: sametimeworld-public-inspection
          path: _local/public-inspection/report.json
          retention-days: 7
