name: Verify four-frame detail and event cards
on:
  push:
    branches: ['feature/detail-frames-tts-20261003']
    paths: ['.github/workflows/detail-check.yml']
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved UI-only patch
        env:
          TRANSFER_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-39b4-8206-aea1-a1cd35a8cd58/raw?se=2026-10-03T02%3A05%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=3dd6fc5a-a612-584e-8f76-06073bacdf8d&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T19%3A51%3A01Z&ske=2026-10-03T19%3A51%3A01Z&sks=b&skv=2026-02-06&sig=hCOeqpH12VU4OiLEu7UpugmIxd2q%2B10s1SP32cini9M%3D'
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$TRANSFER_URL"
          curl -fsSL --max-time 120 "$TRANSFER_URL" -o "$RUNNER_TEMP/patch.zip"
          echo "eea4eced1594a3111e4821a494cdf048e768b6484544a3bcc40658adb06f5e81  $RUNNER_TEMP/patch.zip" | sha256sum -c -
          python3 - <<'PY'
          import pathlib,zipfile,json,os
          root=pathlib.Path.cwd()
          def target(name):
              p=(root/name).resolve()
              if not p.is_relative_to(root) or any(s in ['.git','.github'] for s in pathlib.PurePosixPath(name).parts):raise ValueError('unsafe patch path')
              return p
          with zipfile.ZipFile(os.environ['RUNNER_TEMP']+'/patch.zip') as z:
              for n in z.namelist():
                  if n=='_deployment_delete.json':continue
                  p=target(n);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(n))
              for n in json.loads(z.read('_deployment_delete.json')):
                  if not n.startswith('source-pack/'):raise ValueError('unexpected removal')
                  target(n).unlink(missing_ok=True)
          PY
          BASE=$(git rev-parse HEAD)
          git config user.name 'SameTimeWorld Build'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: four fixed detail frames, right-hand event cards and cancellable automatic TTS'
          git archive --format=zip HEAD -o source.zip
          git bundle create change.bundle HEAD ^$BASE
      - uses: actions/upload-artifact@v4
        with:
          name: detail-staged-source
          path: |
            source.zip
            change.bundle
          retention-days: 7
  browser:
    needs: stage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: detail-staged-source
      - run: unzip -q source.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit regression and build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _local/detail-frames
          npm test > _local/detail-frames/unit.log 2>&1
          python3 -m unittest discover -s tests -p 'test_*.py' >> _local/detail-frames/unit.log 2>&1
          npm run build > _local/detail-frames/build.log 2>&1
          python3 -m pip install playwright --quiet
          python3 -m playwright install --with-deps chromium > "$RUNNER_TEMP/browser-install.log" 2>&1
      - name: Real event-card and fixed-frame browser checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/browser-detail-frames.py > _local/detail-frames/browser.log 2>&1
          python3 tests/browser-series.py >> _local/detail-frames/browser.log 2>&1
          python3 tests/browser-smoke.py --integrated --output _local/original-browser-checks --expected-events 38920 --expected-leaders 6338 --expected-hash 70000ab5e07e7dec0af978a8c5a292bfda7e5a7231ff872fcd429cc02b410467 >> _local/detail-frames/browser.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detail-browser-checks
          path: |
            _local/detail-frames/
            _local/series-checks/
            _local/original-browser-checks/
            dist/release.json
          retention-days: 7
  windows:
    needs: stage
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: detail-staged-source
      - run: Expand-Archive -Path source.zip -DestinationPath project -Force
      - name: Check unchanged backup-first Windows EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory project/installer/build -Force | Out-Null
          & powershell -NoProfile -File project/installer/build.ps1 *> project/installer/build/windows-tests.log
          if ($LASTEXITCODE -ne 0) { Get-Content project/installer/build/windows-tests.log -Tail 80; throw 'Windows checks failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detail-windows-installer
          path: project/installer/build/
          retention-days: 7
  commit:
    needs: [browser,windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: detail-staged-source
          path: _local/staged
      - name: Publish tested application commit to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch _local/staged/change.bundle HEAD:refs/remotes/staged/detail
          git merge --ff-only refs/remotes/staged/detail
          git push origin HEAD:feature/detail-frames-tts-20261003
