name: Final four-frame detail regression
on:
  push:
    branches: ['feature/detail-frames-tts-20261003']
    paths: ['.github/workflows/detail-check.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import final responsive UI patch
        env:
          TRANSFER_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-fca4-8206-a7ed-bf08f2bda37d/raw?se=2026-10-03T02%3A11%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=83818247-0360-5a96-902d-c2839a9b750e&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T01%3A17%3A00Z&ske=2026-10-04T01%3A17%3A00Z&sks=b&skv=2026-02-06&sig=g56PyYE6zxPY71m8YrltZ4v0XNA9r0Nno1p%2Br93qjWQ%3D'
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$TRANSFER_URL"
          curl -fsSL --max-time 120 "$TRANSFER_URL" -o "$RUNNER_TEMP/patch.zip"
          echo "3b0f994da22e26d4de781a25f13c781cb0d00eebc0c1f2c245744cc646e51bb5  $RUNNER_TEMP/patch.zip" | sha256sum -c -
          python3 - <<'PY'
          import pathlib,zipfile,json,os
          root=pathlib.Path.cwd()
          def target(name):
              p=(root/name).resolve()
              if not p.is_relative_to(root) or any(s in ['.git','.github'] for s in pathlib.PurePosixPath(name).parts):raise ValueError('unsafe patch path')
              return p
          with zipfile.ZipFile(os.environ['RUNNER_TEMP']+'/patch.zip') as z:
              for n in z.namelist():
                  if n=='_deployment_delete.json':continue
                  p=target(n);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(n))
              for n in json.loads(z.read('_deployment_delete.json')):
                  if not n.startswith('source-pack/'):raise ValueError('unexpected removal')
                  target(n).unlink(missing_ok=True)
          PY
      - name: Unit tests and production build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _local/detail-frames
          npm test > _local/detail-frames/unit.log 2>&1
          python3 -m unittest discover -s tests -p 'test_*.py' >> _local/detail-frames/unit.log 2>&1
          npm run build > _local/detail-frames/build.log 2>&1
          python3 -m pip install playwright --quiet
          python3 -m playwright install --with-deps chromium > "$RUNNER_TEMP/browser-install.log" 2>&1
      - name: Real desktop mobile landscape event-card checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/browser-detail-frames.py > _local/detail-frames/browser.log 2>&1
          python3 tests/browser-series.py >> _local/detail-frames/browser.log 2>&1
          python3 tests/browser-smoke.py --integrated --output _local/original-browser-checks --expected-events 38920 --expected-leaders 6338 --expected-hash 70000ab5e07e7dec0af978a8c5a292bfda7e5a7231ff872fcd429cc02b410467 >> _local/detail-frames/browser.log 2>&1
      - name: Publish only after all checks succeed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SameTimeWorld Build'
          git config user.email 'actions@users.noreply.github.com'
          git diff --quiet HEAD -- public/t public/s src/packet-config.js src/series-config.js src/point-resolver.js src/event-map.js installer
          git add -A
          git commit -m 'fix: keep all detail actions visible on narrow split screens'
          git push origin HEAD:feature/detail-frames-tts-20261003
          git archive --format=zip HEAD -o _local/final-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-detail-verification
          path: |
            _local/detail-frames/
            _local/series-checks/
            _local/original-browser-checks/
            _local/final-source.zip
            dist/release.json
          retention-days: 7
