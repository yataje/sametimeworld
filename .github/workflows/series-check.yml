name: Windows backup diagnostic
on:
  push:
    branches: ['feature/series-esc-backup-20261003']
    paths: ['.github/workflows/series-check.yml']
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: series-staged-source
          run-id: 37082672752
          github-token: ${{ github.token }}
      - run: Expand-Archive -Path source.zip -DestinationPath project -Force
      - name: Diagnose actual EXE failure
        shell: pwsh
        run: |
          $p='project/installer/test_installer.py'
          $s=Get-Content $p -Raw
          $s=$s.Replace("def runexe(self,*args):return subprocess.run([str(self.exe),*map(str,args)],capture_output=True,timeout=60).returncode", "def runexe(self,*args):`n  r=subprocess.run([str(self.exe),*map(str,args)],capture_output=True,timeout=60);print('EXE',args,r.returncode,r.stderr.decode('utf-8',errors='replace'));return r.returncode")
          [IO.File]::WriteAllText((Join-Path $pwd $p),$s,[Text.UTF8Encoding]::new($false))
          $p='project/installer/LocalSave.cs';$s=(Get-Content $p -Raw).Replace('Console.Error.WriteLine(e.Message)','Console.Error.WriteLine(e.ToString())');[IO.File]::WriteAllText((Join-Path $pwd $p),$s,[Text.UTF8Encoding]::new($false))
          New-Item -ItemType Directory project/installer/build -Force | Out-Null
          & powershell -NoProfile -File project/installer/build.ps1 *> project/installer/build/windows-tests.log
          if ($LASTEXITCODE -ne 0) { Get-Content project/installer/build/windows-tests.log -Tail 100; throw 'Windows verification failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-diagnostic
          path: project/installer/build/
          retention-days: 7
