name: Series and safe installer checks
on:
  push:
    branches: ['feature/series-esc-backup-20261003']
    paths: ['.github/workflows/series-check.yml']
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import approved code and catalogue
        env:
          TRANSFER_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-9e1c-8206-beb1-23b0b02b7638/raw?se=2026-10-03T00%3A39%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=8880518c-4960-5228-bb99-875ac3603464&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T19%3A57%3A27Z&ske=2026-10-03T19%3A57%3A27Z&sks=b&skv=2026-02-06&sig=kRNHKskpAdkpAz5c3JLsOJJr9Vi1jXVx1sOQKfUus8A%3D'
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$TRANSFER_URL"
          curl -fsSL --max-time 120 "$TRANSFER_URL" -o "$RUNNER_TEMP/overlay.zip"
          echo "682680af7f7b209bed8df48f5e5f60a33b41ce88ab03e64405152d4eabc68ac1  $RUNNER_TEMP/overlay.zip" | sha256sum -c -
          python3 - <<'PY'
          import json,os,pathlib,zipfile
          root=pathlib.Path.cwd()
          def target(name):
              p=(root/name).resolve()
              if not p.is_relative_to(root) or any(s in ['.git','.github'] for s in pathlib.PurePosixPath(name).parts): raise ValueError('unsafe path')
              return p
          with zipfile.ZipFile(os.environ['RUNNER_TEMP']+'/overlay.zip') as z:
              for n in z.namelist():
                  if n=='_deployment_delete.json':continue
                  p=target(n);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(n))
              for n in json.loads(z.read('_deployment_delete.json')):
                  if not n.startswith('source-pack/'):raise ValueError('unexpected removal')
                  target(n).unlink(missing_ok=True)
          PY
          BASE=$(git rev-parse HEAD)
          git config user.name 'SameTimeWorld Build'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: concept-based series, Escape navigation and backup-first offline saver'
          git archive --format=zip HEAD -o source.zip
          git bundle create change.bundle HEAD ^$BASE
      - uses: actions/upload-artifact@v4
        with:
          name: series-staged-source
          path: |
            source.zip
            change.bundle
          retention-days: 7
  browser:
    needs: stage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: series-staged-source
      - run: unzip -q source.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full regression and build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _local/series-checks
          npm test > _local/series-checks/unit.log 2>&1
          python3 -m unittest discover -s tests -p 'test_*.py' >> _local/series-checks/unit.log 2>&1
          npm run build > _local/series-checks/build.log 2>&1
          python3 -m pip install playwright --quiet
          python3 -m playwright install --with-deps chromium > "$RUNNER_TEMP/browser-install.log" 2>&1
      - name: Real desktop and mobile tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/browser-series.py > _local/series-checks/browser.log 2>&1
          python3 tests/browser-smoke.py --integrated --output _local/original-browser-checks --expected-events 38920 --expected-leaders 6338 --expected-hash 70000ab5e07e7dec0af978a8c5a292bfda7e5a7231ff872fcd429cc02b410467 >> _local/series-checks/browser.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: series-browser-checks
          path: |
            _local/series-checks/
            _local/original-browser-checks/
            dist/release.json
          retention-days: 7
  windows:
    needs: stage
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: series-staged-source
      - run: Expand-Archive -Path source.zip -DestinationPath project -Force
      - name: Compile and test backup-first EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory project/installer/build -Force | Out-Null
          & powershell -NoProfile -File project/installer/build.ps1 *> project/installer/build/windows-tests.log
          if ($LASTEXITCODE -ne 0) { Get-Content project/installer/build/windows-tests.log -Tail 60; throw 'Windows verification failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: series-windows-installer
          path: project/installer/build/
          retention-days: 7
  commit:
    needs: [browser,windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: series-staged-source
          path: _local/staged
      - name: Push only the tested commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch _local/staged/change.bundle HEAD:refs/remotes/staged/series
          git merge --ff-only refs/remotes/staged/series
          git push origin HEAD:feature/series-esc-backup-20261003
