name: Series and safe installer checks
on:
  push:
    branches: ['feature/series-esc-backup-20261003']
    paths: ['.github/workflows/series-check.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip HEAD -o source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: series-source-snapshot
          path: source.zip
          retention-days: 7
