name: Validate encrypted GitHub-only release
on:
  push:
    branches: ["migration/github-static-v0.5.0"]
    paths: [".migration-*", ".github/workflows/migration-check.yml"]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed migration and verify complete authoritative content
        run: |
          python3 .migration-patch.py
          node .migration-pack.mjs
      - name: Regression and packaging tests
        run: |
          npm test
          npm run build
      - name: Install isolated browser test dependencies
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Desktop, mobile, search, detail, zoom and network-failure checks
        run: python3 tests/browser-smoke.py --expected-events 4470 --expected-leaders 6158 --expected-localities 1977 --expected-hash a486d311c1b5651ab57cd31e1a98fb179f5b3ba0dd846082498514cdc0b83f70
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-browser-checks
          path: _local/browser-checks
          retention-days: 1
      - name: Commit only validated public source and encrypted assets
        run: |
          rm .migration-patch.py .migration-pack.mjs .migration-delta.bin .github/workflows/migration-check.yml
          git config user.name 'SameTimeWorld'
          git config user.email '262569345+yataje@users.noreply.github.com'
          git add -A
          git commit -m 'Complete verified GitHub-only encrypted publication v0.5.0'
          git push origin HEAD:migration/github-static-v0.5.0
          mkdir -p /tmp/stw-final/source
          git archive HEAD | tar -x -C /tmp/stw-final/source
          cp -r dist /tmp/stw-final/dist
          cp -r _local/browser-checks /tmp/stw-final/checks
          git rev-parse HEAD > /tmp/stw-final/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: migration-ready
          path: /tmp/stw-final
          include-hidden-files: true
          retention-days: 1
