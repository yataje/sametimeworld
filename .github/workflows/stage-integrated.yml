name: Verify integrated deployment
on:
  push:
    branches: ['deploy/integrated-20261003']
    paths: ['.github/workflows/stage-integrated.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correct strict browser locator and synchronize test capsule
        run: |
          python3 - <<'PY'
          import pathlib,json,base64,gzip,hashlib
          p=pathlib.Path('tests/browser-smoke.py');s=p.read_text();s=s.replace("locator('xpath=ancestor::section')","locator('xpath=ancestor::section[1]')");p.write_text(s)
          mp=pathlib.Path('source-pack/manifest.json');m=json.loads(mp.read_text());old=m['tests/browser-smoke.py']['file'];b=p.read_bytes();h=hashlib.sha256(b).hexdigest();name='source-pack/'+h[:24]+'.txt';pathlib.Path(name).write_text(base64.b64encode(gzip.compress(b,mtime=0)).decode()+'\n');m['tests/browser-smoke.py']={'file':name,'sha256':h,'size':len(b)};mp.write_text(json.dumps(m,indent=2)+'\n')
          if old!=name:pathlib.Path(old).unlink(missing_ok=True)
          PY
      - name: Unit tests and production build
        run: |
          npm test
          python3 -m unittest discover -s tests -p 'test_*.py'
          npm run build
      - name: Install browser test runner
        run: |
          python3 -m pip install playwright --quiet
          python3 -m playwright install --with-deps chromium > "$RUNNER_TEMP/browser-install.log" 2>&1
      - name: Real desktop and mobile browser regression checks
        run: |
          mkdir -p _local/browser-checks
          python3 tests/browser-smoke.py --integrated --output _local/browser-checks --expected-events 38920 --expected-leaders 6338 --expected-hash 70000ab5e07e7dec0af978a8c5a292bfda7e5a7231ff872fcd429cc02b410467 > _local/browser-checks/console.log 2>&1
          python3 - <<'PY'
          import json
          d=json.load(open('_local/browser-checks/report.json'))
          assert d.get('success') is True,d
          assert len(d['checks'])>=11,d
          print(json.dumps(d,ensure_ascii=False))
          PY
      - name: Commit only after all checks pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'test: complete validated desktop and mobile integrated smoke checks'
            git push origin HEAD:deploy/integrated-20261003
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-browser-verification
          path: |
            _local/browser-checks/
            docs/deployment/integrated-release.json
            dist/release.json
          if-no-files-found: ignore
          retention-days: 7
