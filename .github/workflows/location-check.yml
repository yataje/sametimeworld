name: Location regression checks
on:
  push:
    branches: ['fix/location-resolution-20261003']
    paths: ['.github/workflows/location-check.yml']
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed fixes
        run: |
          python3 scripts/refine-location-policy.py
          python3 scripts/prepare-location-release.py
          mkdir -p _local/location-checks
      - name: Resolve and audit all public events
        shell: bash
        run: |
          set +e
          node scripts/repair-locations.mjs > _local/location-checks/repair.log 2>&1; R=$?
          npm test > _local/location-checks/full.log 2>&1; N=$?
          python3 -m unittest discover -s tests -p 'test_*.py' > _local/location-checks/python.log 2>&1; P=$?
          python3 - <<'PY'
          from pathlib import Path
          import re
          out=[]
          for name in ['repair','full','python']:
              s=Path('_local/location-checks/'+name+'.log').read_text(errors='replace');out.append('=== '+name+' ===')
              if name=='repair':out.append(s[-6000:])
              elif name=='python':out.append(s[-4000:])
              else:
                  lines=s.splitlines()
                  for i,l in enumerate(lines):
                      if l.startswith('not ok '):out.append('\n'.join(lines[i:i+30])[:2500])
                  out.extend(l for l in lines if re.search(r'^# (tests|pass|fail)',l))
          Path('docs/location/check-status.txt').write_text('\n'.join(out),encoding='utf8')
          PY
          cat docs/location/check-status.txt
          echo "$(( R || N || P ))" > _local/location-checks/exitcode
      - name: Persist fixes and report on isolated branch
        run: |
          git config user.name 'SameTimeWorld Geographic Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add src tests scripts source-pack index.html package.json docs/location data/location
          git commit -m 'fix: prefer scoped geographic references and prohibit continent point fallbacks'
          git fetch origin fix/location-resolution-20261003
          git rebase origin/fix/location-resolution-20261003
          git push origin HEAD:fix/location-resolution-20261003
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: location-repair-audit
          path: |
            _local/location-checks/
            docs/location/
          retention-days: 7
      - run: exit $(cat _local/location-checks/exitcode)
