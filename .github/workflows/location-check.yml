name: Location regression checks
on:
  push:
    branches: ['fix/location-resolution-20261003']
    paths: ['.github/workflows/location-check.yml']
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read current public events
        run: |
          mkdir -p _local/location-checks
          node --input-type=module <<'JS'
          import fs from 'node:fs';import {readDescriptor,readPacket,unseal} from './scripts/seal.mjs';
          const r=process.cwd(),d=readDescriptor(r),data=unseal(readPacket(r,d),d);
          fs.writeFileSync('_local/previous-events.json',JSON.stringify(data));
          JS
      - name: Prepare modern county and district references
        run: python3 scripts/prepare-location-reference.py _local/previous-events.json
      - name: Compute repair decisions and run regressions
        shell: bash
        run: |
          set -uo pipefail
          node scripts/repair-locations.mjs > _local/location-checks/repair.log 2>&1
          REPAIR=$?
          node --test tests/location-v2.test.cjs > _local/location-checks/location.log 2>&1
          LOC=$?
          npm test > _local/location-checks/full.log 2>&1
          FULL=$?
          python3 - <<'PY'
          import pathlib,re
          out=[]
          for name in ['repair','location','full']:
              p=pathlib.Path('_local/location-checks/'+name+'.log');s=p.read_text(errors='replace');out.append('=== '+name+' ===')
              if name=='repair':out.append(s[-12000:])
              else:
                  out.extend(x for x in s.splitlines() if re.search(r'not ok|# (tests|pass|fail)|error:|expected:|actual:|ERR_',x))
          pathlib.Path('docs/location/check-status.txt').write_text('\n'.join(out),encoding='utf8')
          PY
          cat docs/location/check-status.txt
          echo "REPAIR=$REPAIR LOC=$LOC FULL=$FULL"
      - name: Save reference and diagnostics on feature branch only
        run: |
          git config user.name 'SameTimeWorld Geographic Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add src/location-extra.js docs/location data/location
          git commit -m 'data: scoped GeoNames references and proposed location repair results'
          git fetch origin fix/location-resolution-20261003
          git rebase origin/fix/location-resolution-20261003
          git push origin HEAD:fix/location-resolution-20261003
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: location-repair-audit
          path: |
            _local/location-checks/
            docs/location/
          retention-days: 7
