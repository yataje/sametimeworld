name: Deploy SameTimeWorld to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The production builder and tests use only Node.js built-ins.
      # Vite remains available for local development, but is not required in CI.

      - name: Test search, leaders and audio
        run: npm test

      - name: Repack public data for lean viewer
        run: npm run repack:lean

      - name: Build portable web release
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed release and public assets
        run: python3 scripts/verify-live.py --url "${{ steps.deployment.outputs.page_url }}" --expected-release dist/release.json --output live-verification.json

      - name: Save public release verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-release-verification
          path: live-verification.json
          if-no-files-found: ignore
          retention-days: 7
